packages:
  - lib
  - ui
  - eicoop
  - wasmegg/_home
  - wasmegg/rockets-tracker
  - wasmegg/virtue-companion

allowBuilds:
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
  workerd: true

peerDependencyRules:
