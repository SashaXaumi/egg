name: update-periodicals
# Sync periodicals data (contracts, events, seasons, custom eggs) from the
# upstream repo (carpetsage/egg), which keeps it fresh from the game API. This
# fork no longer generates the data itself, so no game-API token / EI_USERID is
# needed. On change, the eicoop build is dispatched explicitly (works with the
# default GITHUB_TOKEN — no PAT required).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'

permissions:
  contents: write
  actions: write

env:
  UPSTREAM_REPO: https://github.com/carpetsage/egg.git
  UPSTREAM_BRANCH: main

jobs:
  sync:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Fetch upstream periodicals data
        run: |
          # Base the commit on the very latest remote main so the push
          # fast-forwards even if main advanced since checkout (the bot and
          # local GitHub Desktop pushes can race). We never edit periodicals/data
          # locally, so hard-resetting to origin/main loses nothing.
          git fetch origin "$UPSTREAM_BRANCH"
          git reset --hard "origin/$UPSTREAM_BRANCH"
          git remote add upstream "$UPSTREAM_REPO" 2>/dev/null || git remote set-url upstream "$UPSTREAM_REPO"
          git fetch --depth=1 upstream "$UPSTREAM_BRANCH"
          # Take upstream's version of the data directory.
          git checkout "upstream/$UPSTREAM_BRANCH" -- periodicals/data

      - name: Commit changes and dispatch eicoop build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add periodicals/data
          if git diff --cached --quiet; then
            echo 'periodicals/data already up to date with upstream.'
          else
            git commit -m 'periodicals: sync data from upstream (carpetsage/egg)'
            # Re-sync to the tip and retry once in case main moved during the run.
            git push origin HEAD:"$UPSTREAM_BRANCH" || {
              git fetch origin "$UPSTREAM_BRANCH"
              git rebase "origin/$UPSTREAM_BRANCH"
              git push origin HEAD:"$UPSTREAM_BRANCH"
            }
            # Default GITHUB_TOKEN pushes do not trigger other workflows, so kick
            # the eicoop build explicitly. Pin --repo to this fork: with an
            # `upstream` remote present, gh otherwise targets the parent repo.
            gh workflow run build-eicoops.yml --ref "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"
          fi
