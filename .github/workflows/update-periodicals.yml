name: update-periodicals
# Sync periodicals data (contracts, events, seasons, custom eggs) from the
# upstream repo (carpetsage/egg), which keeps it fresh from the game API. This
# fork no longer generates the data itself, so no game-API token / EI_USERID is
# needed. On change, the eicoop build is dispatched explicitly (works with the
# default GITHUB_TOKEN — no PAT required).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'

permissions:
  contents: write
  actions: write

# Only one sync at a time, so concurrent runs can't race each other's pushes.
concurrency:
  group: update-periodicals
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/carpetsage/egg.git
  UPSTREAM_BRANCH: main

jobs:
  sync:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Sync periodicals from upstream and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git remote add upstream "$UPSTREAM_REPO" 2>/dev/null || git remote set-url upstream "$UPSTREAM_REPO"
          git fetch --depth=1 upstream "$UPSTREAM_BRANCH"

          pushed=""
          for attempt in 1 2 3 4 5; do
            # Re-base on the very latest remote main each attempt, discarding any
            # prior failed commit, so the push is always a clean fast-forward.
            git fetch origin "$UPSTREAM_BRANCH"
            git reset --hard "origin/$UPSTREAM_BRANCH"
            git checkout "upstream/$UPSTREAM_BRANCH" -- periodicals/data
            git add periodicals/data
            if git diff --cached --quiet; then
              echo 'periodicals/data already up to date with upstream — nothing to do.'
              exit 0
            fi
            git commit -m 'periodicals: sync data from upstream (carpetsage/egg)'
            if git push origin "HEAD:$UPSTREAM_BRANCH"; then
              pushed=1
              break
            fi
            echo "Push rejected (attempt $attempt) — main moved, re-syncing and retrying..."
            sleep 3
          done

          if [ -z "$pushed" ]; then
            echo 'Failed to push after 5 attempts.' >&2
            exit 1
          fi

          # Default GITHUB_TOKEN pushes do not trigger other workflows, so kick the
          # eicoop build explicitly. Pin --repo to this fork (an `upstream` remote
          # is present, which would otherwise make gh target the parent repo).
          gh workflow run build-eicoops.yml --ref "$UPSTREAM_BRANCH" --repo "$GITHUB_REPOSITORY"
