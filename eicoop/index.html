<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon-precomposed" href="/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
    <meta name="format-detection" content="telephone=no" />
    <title>CoopTracker</title>
    <meta name="description" content="Egg, Inc. coop tracker and contract master list" />
    <meta property="og:image" content="https://eicoop-carpet.netlify.app/banner.png" />

    <!-- Paint the ferret-dark background immediately so there's no flash of the old
         light theme before the app bundle (and ferret.css) loads. -->

      html,
      body {
        background-color: #16110d;
      }
      .app-loading {
        color: #fbf3df;
      }
    </style>
  </head>
  <body>
    <div id="app" class="flex flex-col flex-1">
      <div class="app-loading dark">Loading application...</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script
      data-goatcounter="https://eicoop-carpet.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>
